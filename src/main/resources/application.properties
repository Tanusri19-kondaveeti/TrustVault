spring.application.name=trustvault

server.port=8081

# MySQL database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trustvault_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway database migrations
spring.flyway.enabled=true
spring.jpa.open-in-view=false
trustvault.jwt.secret=${TRUSTVAULT_JWT_SECRET}
trustvault.jwt.expiration-ms=900000

# SeaweedFS S3 storage
trustvault.storage.endpoint=http://localhost:8333
trustvault.storage.region=us-east-1
trustvault.storage.bucket=trustvault-documents
trustvault.storage.access-key=${TRUSTVAULT_S3_ACCESS_KEY}
trustvault.storage.secret-key=${TRUSTVAULT_S3_SECRET_KEY}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
trustvault.storage.enabled=false
trustvault.storage.type=local
trustvault.storage.local-directory=uploads
