
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: trustvault-storage
    command: server -s3
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:19333:9333"
    environment:
      AWS_ACCESS_KEY_ID: ${TRUSTVAULT_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${TRUSTVAULT_S3_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

volumes:
  seaweedfs_data:
